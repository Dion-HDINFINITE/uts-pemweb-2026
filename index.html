<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Platform Tes Web Dev</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1e1e1e; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        .hidden { display: none !important; }
        .btn { background-color: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold;}
        .btn:hover { background-color: #218838; }
        .center-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; text-align: center; }
        .card { background-color: #2d2d2d; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        .card h2 { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; color: #ccc; }
        .form-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #1e1e1e; color: #fff; }
        #test-screen { display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #333; border-bottom: 1px solid #444; }
        .timer { font-size: 20px; font-weight: bold; color: #ff4757; }
        .workspace { display: flex; flex: 1; overflow: hidden; }
        .instruction-panel { flex: 1; padding: 20px; background-color: #252526; overflow-y: auto; border-right: 1px solid #444; }
        .instruction-panel h3 { color: #4daafc; margin-bottom: 15px; }
        #soal-deskripsi { color: #d4d4d4; line-height: 1.6; }

        #soal-deskripsi h2, #soal-deskripsi h3 { color: #4daafc; font-size: 16px; margin: 14px 0 8px; }
        #soal-deskripsi code { background: #333; padding: 1px 5px; border-radius: 3px; font-family: 'Courier New', monospace; color: #ce9178; }
        #soal-deskripsi pre { background: #1e1e1e; padding: 10px; border-radius: 4px; overflow-x: auto; margin-bottom: 12px; }
        #soal-deskripsi table { border-collapse: collapse; margin-bottom: 12px; }
        #soal-deskripsi th, #soal-deskripsi td { border: 1px solid #555; padding: 4px 10px; text-align: left; }
        .editor-panel { flex: 1; display: flex; flex-direction: column; background-color: #1e1e1e; }
        .editor-header { padding: 10px; background-color: #2d2d2d; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }

        // Penilai berbasis token: membandingkan "apa yang harus ditambahkan" (kunci - soal) dengan "apa yang ditambahkan siswa" (jawaban - soal)
function tokenize(src) {
  src = src.replace(/<!--[\s\S]*?-->/g, ' ').replace(/\/\*[\s\S]*?\*\//g, ' ').replace(/(^|\s)\/\/[^\n]*/g, ' ')
           .toLowerCase().replace(/["'`]/g, ' ');
  const m = src.match(/[a-z_$][\w$]*(?:-[a-z][\w$]*)*|\d+(?:\.\d+)?|[!-~]/g) || [];
  const c = {}; m.forEach(t => c[t] = (c[t] || 0) + 1); return c;
}
function minus(a, b) { const r = {}; for (const k in a) { const d = a[k] - (b[k] || 0); if (d > 0) r[k] = d; } return r; }
function hitungSkor(jawaban, kodeAwal, kunciList) {
  const T = tokenize(kodeAwal), S = minus(tokenize(jawaban), T);
  let best = 0;
  kunciList.forEach(k => {
    const A = minus(tokenize(k), T); let total = 0, ok = 0;
    for (const t in A) { total += A[t]; ok += Math.min(A[t], S[t] || 0); }
    best = Math.max(best, total ? ok / total : 0);
  });
  return Math.round(best * 100);
}

        let namaMhs = "", npmMhs = "", soalAktif = null, waktuSisa = 600, timerInterval;

        document.getElementById('code-editor').addEventListener('keydown', function (e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const s = this.selectionStart;
                this.value = this.value.slice(0, s) + '    ' + this.value.slice(this.selectionEnd);
                this.selectionStart = this.selectionEnd = s + 4;
            }
        });

        function mulaiUjian() {
            namaMhs = document.getElementById('input-nama').value.trim();
            npmMhs = document.getElementById('input-npm').value.trim();
            const keyword = document.getElementById('input-keyword').value.trim().toLowerCase();

            if (!namaMhs || !npmMhs || !keyword) { alert("Harap isi semua data!"); return; }

            const materi = mapKeyword[keyword];
            if (!materi) { document.getElementById('login-error').style.display = 'block'; return; }

            const daftarSoal = bankSoal[materi];
            soalAktif = daftarSoal[Math.floor(Math.random() * daftarSoal.length)];
            soalAktif = { kodeAwal: dec(soalAktif.kodeAwal), kunci: soalAktif.kunci.map(dec), judul: soalAktif.judul, deskripsi: soalAktif.deskripsi };

            document.getElementById('display-materi').innerText = "Materi: " + materi;
            document.getElementById('display-identitas').innerText = namaMhs + " (" + npmMhs + ")";
            document.getElementById('soal-judul').innerText = soalAktif.judul;
            document.getElementById('soal-deskripsi').innerHTML = soalAktif.deskripsi;
            document.getElementById('code-editor').value = soalAktif.kodeAwal;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('test-screen').classList.remove('hidden');
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            waktuSisa--;
            const menit = Math.floor(waktuSisa / 60), detik = waktuSisa % 60;
            document.getElementById('display-timer').innerText = (menit < 10 ? "0" + menit : menit) + ":" + (detik < 10 ? "0" + detik : detik);
            if (waktuSisa <= 0) kumpulkanJawaban();
        }

        function kumpulkanJawaban() {
            clearInterval(timerInterval);
            const jawaban = document.getElementById('code-editor').value;
            let nilai = hitungSkor(jawaban, soalAktif.kodeAwal, soalAktif.kunci);
            if (nilai < 10) nilai = 10; // nilai partisipasi

            document.getElementById('test-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('hasil-nama').innerText = namaMhs;
            document.getElementById('hasil-npm').innerText = npmMhs;
            document.getElementById('hasil-nilai').innerText = nilai;
            document.getElementById('hasil-nilai').style.color = nilai >= 70 ? '#28a745' : '#ff4757';
        }
